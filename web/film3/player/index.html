<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HADİ Film</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #c, #xfade { position: absolute; display: block; }
  #xfade { pointer-events: none; opacity: 0; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
  #subs { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 6%; opacity: 0; transition: opacity .18s ease;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #subs.on { opacity: 1; }
  #subs .who { color: #E6B566; font-size: 12px; letter-spacing: .16em; font-weight: 800; text-transform: uppercase; margin-bottom: 3px;
    text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  #subs .txt { display: inline-block; color: #F1EEE8; font-size: clamp(15px, 2.4vw, 22px); line-height: 1.35; font-weight: 600; max-width: 820px;
    text-shadow: 0 1px 2px #000, 0 0 10px rgba(0,0,0,.85); }
  #chip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: none; padding: 8px 14px; border-radius: 18px;
    background: rgba(21,22,28,.82); color: #F1EEE8; border: 1px solid rgba(255,255,255,.2); font: 600 13px system-ui, sans-serif; }
</style>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="xfade"></canvas>
<div id="fade"></div>
<div id="subs"></div>
<div id="chip">Sesi açmak için dokun</div>
<script type="module" src="./player.js"></script>
</body>
</html>
