<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HADİ Film</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #c, #xfade { position: absolute; display: block; }
  #xfade { pointer-events: none; opacity: 0; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
  #subs { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 6%; opacity: 0; transition: opacity .18s ease;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #subs.on { opacity: 1; }
  #subs .who { color: #E6B566; font-size: 12px; letter-spacing: .16em; font-weight: 800; text-transform: uppercase; margin-bottom: 3px;
    text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  #subs .txt { display: inline-block; color: #F1EEE8; font-size: clamp(15px, 2.4vw, 22px); line-height: 1.35; font-weight: 600; max-width: 820px;
    text-shadow: 0 1px 2px #000, 0 0 10px rgba(0,0,0,.85); }
  #chip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: none; padding: 8px 14px; border-radius: 18px;
    background: rgba(21,22,28,.82); color: #F1EEE8; border: 1px solid rgba(255,255,255,.2); font: 600 13px system-ui, sans-serif; }
  /* Künye: filmde kullanılan üçüncü taraf modellerin atfı (CC BY 4.0). Film sonunda ve "i" düğmesiyle görünür. */
  #infoBtn { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; display: none; padding: 0; cursor: pointer;
    background: rgba(21,22,28,.55); color: #F1EEE8; border: 1px solid rgba(255,255,255,.28); font: italic 700 15px Georgia, serif; line-height: 28px; }
  #credits { position: absolute; right: 12px; bottom: 12px; display: none; max-width: min(520px, calc(100vw - 24px)); max-height: 62%; overflow: auto;
    padding: 12px 14px 10px; border-radius: 12px; background: rgba(15,16,20,.88); color: #E9E5DC; border: 1px solid rgba(255,255,255,.14);
    font: 12px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: text; user-select: text; }
  #credits.on, #infoBtn.on { display: block; }
  #credits h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #E6B566; }
  #credits ul { margin: 0; padding: 0; list-style: none; }
  #credits li { margin: 0 0 5px; }
  #credits .t { font-weight: 700; color: #F6F2EA; }
  #credits .u { color: #A9B4C2; word-break: break-all; font-size: 11px; }
  #credits .n { margin-top: 6px; color: #A9A49A; font-size: 11px; }
</style>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="xfade"></canvas>
<div id="fade"></div>
<div id="subs"></div>
<div id="chip">Sesi açmak için dokun</div>
<button id="infoBtn" type="button" aria-label="Künye" title="Künye">i</button>
<div id="credits" role="dialog" aria-label="Künye"></div>
<script type="module" src="./player.js"></script>
<!-- Flutter denetim köprüsü (altyazı payı, künye, ses kilidi): chrome.js -->
<script type="module" src="./chrome.js"></script>
</body>
</html>
